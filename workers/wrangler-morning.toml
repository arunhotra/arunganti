# Wrangler configuration for Morning Worker
# Deploy with: wrangler deploy --config wrangler-morning.toml

name = "morning-worker"
main = "morning-worker.js"
compatibility_date = "2024-01-01"

# KV Namespace for Rate Limiting
# Create namespace with: wrangler kv:namespace create "RATE_LIMIT_KV" --config wrangler-morning.toml
# Then update the id below with the generated namespace ID
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "4c6645b13e5345bc96d86477bfc1b7ed"

# KV Namespace for morning content (dating events, and future dashboard
# sections) written by the daily "boston-dating-events" scheduled task.
# Create namespace with: wrangler kv namespace create "MORNING_CONTENT_KV" --config wrangler-morning.toml
# Then update the id below with the generated namespace ID.
[[kv_namespaces]]
binding = "MORNING_CONTENT_KV"
id = "93f97a465f194b4dbfc4a88a9d30d84e"

# Worker configuration
[build]
command = ""

# Routes (update with your actual domain)
# [[routes]]
# pattern = "morning-worker.arunhotra.workers.dev/*"
# zone_name = "arunhotra.com"
